name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Server tests (isolated files, bounded)
        run: |
          set -euo pipefail
          for file in server/*.test.mjs; do
            echo "::group::$file"
            timeout 45s node --test --test-force-exit --test-timeout=30000 "$file"
            echo "::endgroup::"
          done
      - name: Core tests and typecheck
        run: npm run test --prefix packages/core
      - name: MCP tests
        run: npm test --prefix packages/mcp
      - name: MCP package check
        run: npm run pack:check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
